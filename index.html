<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business Sales Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#172033;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1180px;margin:auto;padding:42px 22px}.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#667085}.title{font-size:34px;margin:8px 0 6px}.sub{color:#667085;margin:0 0 28px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px}.label{font-size:13px;color:#667085}.value{font-size:27px;font-weight:750;margin-top:8px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}.panel h2{font-size:17px;margin:0 0 18px}.chart{height:340px}.footer{color:#98a2b3;font-size:13px;margin-top:22px}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:480px){.cards{grid-template-columns:1fr}.wrap{padding:28px 16px}.title{font-size:28px}}
</style>
</head>
<body><main class="wrap">
<div class="eyebrow">Sales Intelligence</div><h1 class="title">Business Sales Analytics</h1><p class="sub">Interactive sales performance and KPI dashboard</p>
<section class="cards"><div class="card"><div class="label">Total Revenue</div><div id="revenue" class="value">—</div></div><div class="card"><div class="label">Total Profit</div><div id="profit" class="value">—</div></div><div class="card"><div class="label">Transactions</div><div id="transactions" class="value">—</div></div><div class="card"><div class="label">Avg Order Value</div><div id="aov" class="value">—</div></div></section>
<section class="grid"><div class="panel"><h2>Monthly Performance</h2><div class="chart"><canvas id="monthly"></canvas></div></div><div class="panel"><h2>Regional Performance</h2><div class="chart"><canvas id="regions"></canvas></div></div></section>
<section class="panel" style="margin-top:16px"><h2>Product Performance</h2><div class="chart"><canvas id="products"></canvas></div></section>
<div class="footer">Powered by FastAPI, Pandas and Chart.js</div>
</main>
<script>
const money=v=>'$'+Number(v).toLocaleString(undefined,{maximumFractionDigits:0});
fetch('/api/dashboard').then(r=>r.json()).then(d=>{
 document.querySelector('#revenue').textContent=money(d.kpis.revenue);document.querySelector('#profit').textContent=money(d.kpis.profit);document.querySelector('#transactions').textContent=d.kpis.transactions.toLocaleString();document.querySelector('#aov').textContent=money(d.kpis.aov);
 new Chart(document.querySelector('#monthly'),{type:'line',data:{labels:d.monthly.map(x=>x.Month),datasets:[{label:'Revenue',data:d.monthly.map(x=>x.Revenue),tension:.25},{label:'Profit',data:d.monthly.map(x=>x.Profit),tension:.25}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
 new Chart(document.querySelector('#regions'),{type:'bar',data:{labels:d.regions.map(x=>x.Region),datasets:[{label:'Revenue',data:d.regions.map(x=>x.Revenue)}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
 new Chart(document.querySelector('#products'),{type:'bar',data:{labels:d.products.map(x=>x.Product),datasets:[{label:'Revenue',data:d.products.map(x=>x.Revenue)},{label:'Profit',data:d.products.map(x=>x.Profit)}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
}).catch(()=>document.querySelector('.sub').textContent='Dashboard data could not be loaded.');
</script></body></html>
